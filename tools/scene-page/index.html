<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现场</title>
<style>
  :root { --bg: #ededed; --panel: #f7f7f7; --line: #dcdcdc; --text: #1f2328; --dim: #8a8f98; --me: #95ec69; --bubble: #fff; --pin: #fffbe6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: flex; }
  aside { width: 420px; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; flex: none; }
  aside h3 { margin: 4px 6px 10px; font-size: 13px; color: var(--dim); font-weight: 500; }
  .task { background: #fff; border: 1px solid var(--line); border-left: 4px solid; border-radius: 6px; padding: 7px 9px; margin: 2px 2px 8px 52px; cursor: pointer; font-size: 13px; }
  .task:hover { border-color: #afb8c1; }
  .task .tw { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .task .tw i { flex: none; margin-top: 1px; width: 7px; height: 7px; border-radius: 50%; background: #1a7f37; animation: pulse 1.2s ease-in-out infinite; }
  .task .tt { margin: 2px 0 4px; line-height: 1.45; }
  .task .tn { display: flex; gap: 10px; font-size: 12px; color: var(--dim); }
  .task .tn b { color: var(--text); font-weight: 600; }
  .task .tl { margin-top: 4px; font-size: 12px; color: #57606a; border-top: 1px dashed #e1e4e8; padding-top: 4px; }
  .task.wait { border-left-color: #cf222e !important; }
  .idle { color: var(--dim); font-size: 12px; margin: 0 6px 8px 52px; line-height: 1.45; }
  aside h3 { display: flex; align-items: center; }
  aside h3 .all { margin-left: auto; font-size: 12px; color: #0969da; cursor: pointer; font-weight: 400; }
  .grp .mem { cursor: pointer; user-select: none; }
  .grp .mem:hover { background: rgba(0,0,0,.04); }
  .grp .mem .chev { width: 14px; color: #57606a; font-size: 10px; flex: none; text-align: center; }
  .grp .mem .cnt { margin-left: auto; font-size: 12px; color: var(--dim); }
  .mem .nm .desc { font-size: 12px; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .grp.folded .sub { display: none; }
  .mem { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; }
  .mem .st { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mem .who2 { flex: 1; min-width: 0; }
  .mem .st .brief { color: #57606a; }
  .mem.busy .st { color: #1a7f37; }
  .mem.busy { background: #e9f7ec; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
  header .t { font-weight: 600; }
  header .dim { color: var(--dim); font-size: 12px; }
  header .pick { margin-left: auto; }
  header .view { display: flex; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
  header .view button { border: 0; background: #fff; padding: 3px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  header .view button.on { background: #1f2328; color: #fff; }
  header .view .badge { background: #cf222e; color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  #mine { flex: 1; overflow-y: auto; padding: 14px 18px 30px; display: none; }
  body.mine #mine { display: block; }
  body.mine #list, body.mine #todo, body.mine .pinned { display: none; }
  #mine h2 { font-size: 15px; margin: 4px 0 8px; display: flex; align-items: center; gap: 10px; }
  #mine h2 .n { font-size: 12px; color: var(--dim); font-weight: 400; }
  #mine .filters { margin-left: auto; display: flex; gap: 4px; }
  #mine .filters button { border: 1px solid #d0d7de; background: #fff; border-radius: 4px; padding: 0 8px; font: inherit; font-size: 12px; cursor: pointer; }
  #mine .filters button.on { background: #1f2328; color: #fff; border-color: #1f2328; }
  #mine .none { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  #mine .day { font-size: 12px; color: var(--dim); margin: 14px 0 4px; font-weight: 600; }
  #mine .rec { background: #fff; border: 1px solid var(--line); border-left: 4px solid #1a7f37; border-radius: 6px; padding: 7px 10px; margin: 6px 0; font-size: 13px; }
  #mine .rec.gate { border-left-color: #bf8700; }
  #mine .rec .top { display: flex; gap: 8px; color: var(--dim); font-size: 12px; }
  #mine .rec .top b { color: var(--text); }
  #mine .rec .q { margin: 3px 0; }
  #mine .rec .a { color: #1a7f37; font-weight: 600; }
  #mine .todo-in-mine .it { background: #fff; border: 1px solid #f0d5bb; border-left: 4px solid #cf222e; border-radius: 6px; margin-top: 6px; padding: 7px 10px; }
  #mine .todo-in-mine .it.gate { border-left-color: #bf8700; }
  #mine .todo-in-mine .it .q { font-weight: 600; }
  #mine .todo-in-mine .it .meta { font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
  #mine .todo-in-mine .it .ctx { font-size: 12px; color: #57606a; margin-bottom: 6px; }
  #mine .todo-in-mine .opts { padding: 0; flex-direction: row; flex-wrap: wrap; }
  header .jlink { color: #0969da; text-decoration: none; font-size: 13px; border: 1px solid #d0d7de; border-radius: 6px; padding: 2px 10px; background: #fff; }
  header .jlink:hover { background: #f6f8fa; }
  .pinned { background: var(--pin); border-bottom: 1px solid #f0e2a8; padding: 8px 14px; font-size: 13px; }
  .pinned b { margin-right: 6px; }
  .pinned .wait { color: #cf222e; font-weight: 600; }
  #list { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .time { text-align: center; color: var(--dim); font-size: 12px; margin: 14px 0 6px; }
  .sys { text-align: center; margin: 6px 0; }
  .sys span { display: inline-block; background: rgba(0,0,0,.06); color: #57606a; font-size: 12px; padding: 3px 10px; border-radius: 4px; max-width: 80%; }
  .sys.done span { background: #e9f7ec; color: #1a7f37; }
  .msg { display: flex; gap: 8px; margin: 4px 0; align-items: flex-start; }
  .msg.me { flex-direction: row-reverse; }
  .av { width: 38px; height: 38px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
  .av.ghost { visibility: hidden; height: 0; }
  .body { flex: none; width: 70%; min-width: 0; }
  .body > .bub, .body > .card { display: block; width: 100%; }
  .name { font-size: 12px; color: var(--dim); margin: 0 2px 2px; }
  .msg.me .name { text-align: right; }
  .bub { background: var(--bubble); padding: 7px 11px; border-radius: 6px; word-break: break-word; white-space: pre-wrap; }
  .msg.me .bub { background: var(--me); }
  .bub .at { color: #0969da; font-weight: 600; }
  .bub.small { font-size: 13px; color: #3d434b; }
  .card { background: #fff; border-radius: 6px; overflow: hidden; border: 1px solid #e3e3e3; }
  .card .hd { padding: 6px 11px; font-size: 12px; font-weight: 600; color: #fff; }
  .card .bd { padding: 8px 11px; white-space: pre-wrap; }
  .card .ft { padding: 6px 11px; font-size: 12px; color: var(--dim); border-top: 1px solid #eee; display: flex; gap: 12px; flex-wrap: wrap; }
  .opts { display: flex; flex-direction: column; gap: 6px; padding: 0 11px 10px; }
  .opts button { text-align: left; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .opts button:hover { background: #eef1f4; }
  .opts button.lean { border-color: #bf8700; background: #fff8c5; }
  .opts button.other { color: #57606a; border-style: dashed; }
  .opts button:disabled { opacity: .5; cursor: default; }
  .plan li { list-style: none; padding: 2px 0; }
  .plan ol { margin: 0; padding: 6px 11px 8px; }
  .plan li.done { color: #1a7f37; }
  .plan li.now { font-weight: 600; }
  .plan li.todo { color: #57606a; }
  .plan li::before { display: inline-block; width: 1.6em; }
  .plan li.done::before { content: "☑"; }
  .plan li.now::before { content: "▶"; color: #0969da; }
  .plan li.todo::before { content: "☐"; }
  .pbar { height: 5px; background: #eaeef2; border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: #1a7f37; }
  .stepno { color: #0969da; font-weight: 600; margin-right: 4px; }
  .answered { padding: 0 11px 10px; font-size: 13px; color: #1a7f37; }
  .more { color: #0969da; cursor: pointer; font-size: 12px; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px; color: var(--dim); font-size: 13px; }
  @media (max-width: 720px) { aside { display: none; } }

  #todo { background: #fff8f0; border-bottom: 1px solid #f3d9bf; padding: 6px 14px 8px; max-height: 42vh; overflow-y: auto; }
  #todo:empty { display: none; }
  #todo .th { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #todo .th b { color: #cf222e; }
  #todo .th .fold { margin-left: auto; font-size: 12px; color: #0969da; cursor: pointer; }
  #todo.folded .it { display: none; }
  #todo .it { background: #fff; border: 1px solid #f0d5bb; border-left: 4px solid #cf222e; border-radius: 6px; margin-top: 6px; padding: 7px 10px; }
  #todo .it.gate { border-left-color: #bf8700; }
  #todo .it .q { font-weight: 600; }
  #todo .it .meta { font-size: 12px; color: var(--dim); margin: 2px 0 6px; }
  #todo .it .opts { padding: 0; flex-direction: row; flex-wrap: wrap; }
  #todo .it .ctx { font-size: 12px; color: #57606a; margin-bottom: 6px; }
  #lanes { background: #fff; border-bottom: 1px solid var(--line); padding: 6px 14px 4px; }
  #lanes .lhd { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
  #lanes .lhd b { color: var(--text); font-size: 13px; }
  #lanes .lhd .now { color: #1a7f37; }
  #lanes .lhd .zoom { margin-left: auto; display: flex; gap: 4px; }
  #lanes .lhd button { border: 1px solid #d0d7de; background: #fff; border-radius: 4px; padding: 0 7px; font: inherit; font-size: 12px; cursor: pointer; color: var(--text); }
  #lanes .lhd button.on { background: #1f2328; color: #fff; border-color: #1f2328; }
  #lanes svg { display: block; margin-top: 4px; }
  #lanes.folded svg { display: none; }
  #lanes svg text { font-size: 10px; fill: #57606a; }
  #lanes .trip { cursor: pointer; }
  #lanes .trip:hover rect { stroke: #1f2328; stroke-width: 1.5; }
  #lanes .live { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .flash { animation: flash 1.6s ease-out; border-radius: 8px; }
  @keyframes flash { 0% { background: #fff3b0; } 100% { background: transparent; } }
</style>
</head>
<body>
<aside><h3>群成员 · 各自在做什么<span class="all" id="foldall">全部收起</span></h3><div id="mem"></div></aside>
<main>
  <header><span class="t" id="title">现场</span><span class="dim" id="sub"></span><span class="view" id="view"><button data-v="chat">💬 群聊</button><button data-v="mine">👤 我的<span class="badge" id="minebadge" style="display:none"></span></button></span><span class="pick" id="pick"></span><a class="jlink" id="jlink" href="../../journal">📒 日志</a></header>
  <div id="lanes"><div class="lhd"><b>谁在工作</b><span class="now" id="lnow"></span><span class="zoom"><button data-z="60" class="on">1 小时</button><button data-z="180">3 小时</button><button data-z="0">全天</button><button id="lfold">收起</button></span></div><svg id="lsvg"></svg></div>
  <div id="todo"></div>
  <div class="pinned" id="pin"></div>
  <div id="list"></div>
  <div id="mine"></div>
  <footer id="foot">角色的发问会在上面冒出来：点选项就是回答，「别的说法」可以自己写一句</footer>
</main>
<script src="page.js"></script>
<script>
const D = Scene, { esc, hm, dur, role } = D

function avatar(who, ghost) {
  return '<div class="av' + (ghost ? ' ghost' : '') + '" style="background:' + role(who).color + '">' + esc(role(who).short) + '</div>'
}
const clip = (s, n) => { s = String(s ?? ''); return s.length > n ? esc(s.slice(0, n)) + '… <span class="more" onclick="this.parentNode.textContent=this.dataset.full" data-full="' + esc(s) + '">展开</span>' : esc(s) }

function msg(who, inner, e, prev) {
  const me = who === '人'
  const same = prev && prev.speaker === who && new Date(e.ts) - new Date(prev.ts) < 5 * 60e3
  return '<div class="msg' + (me ? ' me' : '') + '">' + avatar(who, same) + '<div class="body">' + (same ? '' : '<div class="name">' + esc(me ? '你' : who) + ' · ' + hm(e.ts) + '</div>') + inner + '</div></div>'
}

function render(d, first) {
  const evs = D.events(d)
  const busy = D.busy(evs)
  document.getElementById('title').textContent = (d.project || '现场') + '（' + D.ORDER.length + '）'
  document.getElementById('sub').textContent = d.date + ' · ' + evs.length + ' 笔'
  D.datePicker(d, document.getElementById('pick'))
  document.getElementById('jlink').href = '../../journal?date=' + encodeURIComponent(d.date)

  // 置顶：这一段、这一步、谁在干
  const b = d.board
  const wait = D.pending(d).length
  document.getElementById('pin').innerHTML = '📌 <b>' + esc(b.slice || '—') + '</b>' + esc(b.phase || '') + ' · ' + esc(b.step || '') +
    ' · <b>' + esc(b.who || '—') + '</b>' + (b.since ? '已 ' + dur(Date.now() - new Date(b.since)) : '') + (wait ? ' · <span class="wait">' + wait + ' 个问题等你答（见上面待办）</span>' : '')

  // 消息流
  const list = document.getElementById('list')
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80
  let h = '', prev = null, lastTs = 0
  const trips = new Map(D.trips(evs).map((t) => [t.start.i, t]))
  const tripOf = new Map(); for (const t of trips.values()) if (t.plan) tripOf.set(t.plan.i, t)
  for (const e of evs) {
    const t = new Date(e.ts)
    if (t - lastTs > 10 * 60e3) { h += '<div class="time">' + hm(e.ts) + '</div>'; prev = null }
    lastTs = t
    let speaker = e.who
    if (e.kind === 'set') {
      h += '<div class="sys' + (e.done ? ' done' : '') + '"><span>' + (e.done ? '✓ ' : '') + esc(e.who || '') + '：' + esc(e.text) + '</span></div>'; prev = null; continue
    }
    if (e.kind === 'handoff') { h += '<div class="sys"><span>📦 交接：' + clip(e.text, 160) + '</span></div>'; prev = null; continue }
    if (e.kind === 'dispatch') {
      speaker = '开发指挥'
      h += '<div id="m-' + e.i + '"></div>'
      h += msg(speaker, '<div class="bub"><span class="at">@' + esc(e.who) + '</span> ' + esc(e.text) + '</div>', e, prev)
    } else if (e.kind === 'plan') {
      const t = tripOf.get(e.i), ps = D.planState(t && t.plan === e ? t : { plan: e, steps: [], end: null })
      h += msg(speaker, '<div class="card plan"><div class="hd" style="background:' + role(e.who).color + '">📋 计划（共 ' + (e.steps || []).length + ' 步）</div><ol>' + (e.steps || []).map((x, j) => '<li class="' + (ps ? ps.state[j] : 'todo') + '">' + (j + 1) + '. ' + esc(x) + '</li>').join('') + '</ol></div>', e, prev)
    } else if (e.kind === 'progress') {
      h += msg(speaker, '<div class="bub small">' + (e['步'] ? '<span class="stepno">第 ' + e['步'] + ' 步</span>' : '') + clip(e.text, 400) + '</div>', e, prev)
    } else if (e.kind === 'back') {
      const stats = [e.elapsedMs != null && '⏱ ' + dur(e.elapsedMs), e.steps != null && '细步 ' + e.steps + ' 句', e.tools != null && '工具 ' + e.tools + ' 次', e.tokens != null && D.k(e.tokens) + ' tokens'].filter(Boolean)
      h += msg(speaker, '<div class="card"><div class="hd" style="background:' + role(e.who).color + '">✔ 交回' + (e.outcome && e.outcome !== '交回' ? '（' + esc(e.outcome) + '）' : '') + '</div><div class="bd">' + clip(e.text, 300) + '</div>' + (stats.length ? '<div class="ft">' + stats.map((s) => '<span>' + s + '</span>').join('') + '</div>' : '') + '</div>', e, prev)
    } else if (e.kind === 'ask') {
      const q = e.q
      const opts = (q?.options || []).map((o, j) => { const lean = q.lean && String(o).startsWith(q.lean); return '<button class="' + (lean ? 'lean' : '') + '" onclick="Scene.answer(this,\'' + esc(e.id) + '\',' + j + ')">' + esc(o) + (lean ? '　★ 它偏向这个' : '') + '</button>' }).join('') +
        (q ? '<button class="other" onclick="Scene.answer(this,\'' + esc(e.id) + '\',-1)">别的说法…</button>' : '')
      h += msg(speaker, '<div class="card"><div class="hd" style="background:#cf222e">❓ ' + esc(e.id || '') + ' 问你' + (e.confidence ? ' · 信心' + esc(e.confidence) : '') + '</div><div class="bd">' + clip(e.text, 260) + '</div>' +
        (q?.answeredAt ? '<div class="answered">你答了：' + esc(q.answer ?? '') + '</div>' : opts ? '<div class="opts">' + opts + '</div>' : '') + '</div>', e, prev)
    } else if (e.kind === 'answer') {
      speaker = '人'
      h += msg('人', '<div class="bub">' + esc(e.text) + (e.id ? '　<span style="color:#57606a;font-size:12px">（答 ' + esc(e.id) + '）</span>' : '') + '</div>', e, prev)
    } else {
      h += '<div class="sys"><span>' + esc(e.who || '') + ' · ' + esc(e.kind) + '：' + clip(e.text, 120) + '</span></div>'; prev = null; continue
    }
    prev = { speaker, ts: e.ts }
  }
  list.innerHTML = h || '<div class="sys"><span>这一天还没有动静</span></div>'
  if (first || nearBottom) list.scrollTop = list.scrollHeight
  drawLanes(d)
  drawTasks(d)
  drawTodo(d)
}

// ---------- 待办：等你答的问题，加上切片上等你拍板的关卡 ----------
let todoFolded = false
try { todoFolded = localStorage.getItem('chat-todo-fold') === '1' } catch (e) {}
async function drawTodo(d) {
  let gates = []
  try { gates = (await (await fetch('../../todo')).json()).gates || [] } catch (e) { /* 单独起看板、不在工作台里时没有关卡 */ }
  const qs = D.pending(d)
  const el = document.getElementById('todo')
  const n = qs.length + gates.length
  lastGates = gates
  const badge = document.getElementById('minebadge'); badge.style.display = n ? '' : 'none'; badge.textContent = n
  if (view === 'mine') drawMine(d)
  if (!n) { el.innerHTML = ''; return }
  el.classList.toggle('folded', todoFolded)
  el.innerHTML = '<div class="th">📋 <b>待办 ' + n + ' 件</b><span class="dim" style="color:var(--dim);font-size:12px">' + (qs.length ? qs.length + ' 个问题等你答' : '') + (qs.length && gates.length ? '，' : '') + (gates.length ? gates.length + ' 个关卡等你拍板' : '') + '</span><span class="fold" id="todofold">' + (todoFolded ? '展开' : '收起') + '</span></div>' +
    todoItems(qs, gates)
  document.getElementById('todofold').onclick = () => { todoFolded = !todoFolded; try { localStorage.setItem('chat-todo-fold', todoFolded ? '1' : '0') } catch (e) {} ; drawTodo(d) }
}
function todoItems(qs, gates) {
  return gates.map((g) => '<div class="it gate"><div class="q">' + esc(g.slice) + (g.title ? ' ' + esc(g.title) : '') + '</div><div class="ctx">' + esc(g.ask) + '</div><div class="opts"><button onclick="gate(this,\'' + esc(g.kind) + '\',\'' + esc(g.slice) + '\')">' + esc(g.button) + '</button></div></div>').join('') +
    qs.map((q) => '<div class="it"><div class="q">' + esc(q.question) + '</div><div class="meta">' + esc(q.who) + ' 问的 · ' + esc(q.id) + ' · 已等 ' + dur(Date.now() - new Date(q.ts)) + (q.confidence ? ' · 它的信心' + esc(q.confidence) : '') + '</div>' +
      (q.doing || q.context ? '<div class="ctx">' + (q.doing ? '在做：' + esc(q.doing) : '') + (q.doing && q.context ? '　' : '') + (q.context ? '上下文：' + esc(q.context) : '') + '</div>' : '') +
      '<div class="opts">' + (q.options || []).map((o, j) => { const lean = q.lean && String(o).startsWith(q.lean); return '<button class="' + (lean ? 'lean' : '') + '" onclick="Scene.answer(this,\'' + esc(q.id) + '\',' + j + ')">' + esc(o) + (lean ? '　★ 它偏向' : '') + '</button>' }).join('') +
      '<button class="other" onclick="Scene.answer(this,\'' + esc(q.id) + '\',-1)">别的说法…</button></div></div>').join('')
}

// ---------- 我的：我的待办 + 我的处理记录 ----------
let view = 'chat', lastGates = [], mineFilter = 'all'
try { view = localStorage.getItem('chat-view') || 'chat'; mineFilter = localStorage.getItem('chat-mine-filter') || 'all' } catch (e) {}
view = new URLSearchParams(location.search).get('view') || view // ?view=mine 直接打开「我的」
function setView(v) {
  view = v; document.body.classList.toggle('mine', v === 'mine')
  document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === v))
  try { localStorage.setItem('chat-view', v) } catch (e) {}
  if (v === 'mine' && taskD) drawMine(taskD)
}
document.querySelectorAll('#view button').forEach((b) => (b.onclick = () => setView(b.dataset.v)))
setTimeout(() => setView(view)) // 等下面的 taskD 声明完再切
function drawMine(d) {
  const qs = D.pending(d), gates = lastGates
  const n = qs.length + gates.length
  // 处理记录：答过的问题（看板上每个问题都留着答复、几点答的、从哪儿答的），加上拍过板的关卡（日志里 kind=gate 的笔，/feed 带着）
  const recs = []
  for (const q of d.questions || []) if (q.answeredAt) recs.push({ ts: q.answeredAt, kind: 'answer', q })
  for (const g of d.mine?.gates || []) recs.push({ ts: g.ts, kind: 'gate', g })
  recs.sort((a, b) => String(b.ts).localeCompare(String(a.ts)))
  const shown = recs.filter((r) => mineFilter === 'all' || r.kind === mineFilter)
  let h = '<h2>📋 我的待办 <span class="n">' + (n ? n + ' 件：' + (qs.length ? qs.length + ' 个问题' : '') + (qs.length && gates.length ? '，' : '') + (gates.length ? gates.length + ' 个关卡' : '') : '没有') + '</span></h2>'
  h += n ? '<div class="todo-in-mine">' + todoItems(qs, gates) + '</div>' : '<div class="none">没有等你的事。</div>'
  h += '<h2 style="margin-top:22px">🗂 我的处理记录 <span class="n">答过 ' + recs.filter((r) => r.kind === 'answer').length + ' 个问题 · 拍过 ' + recs.filter((r) => r.kind === 'gate').length + ' 次板</span><span class="filters">' +
    [['all', '全部'], ['answer', '答问题'], ['gate', '拍板']].map(([k, t]) => '<button data-f="' + k + '" class="' + (mineFilter === k ? 'on' : '') + '">' + t + '</button>').join('') + '</span></h2>'
  let day = ''
  for (const r of shown) {
    const dd = new Date(r.ts).toLocaleDateString('sv-SE')
    if (dd !== day) { day = dd; h += '<div class="day">' + dd + '</div>' }
    if (r.kind === 'answer') {
      const q = r.q
      h += '<div class="rec"><div class="top"><span>' + hm(r.ts) + '</span><b>答问题</b><span>' + esc(q.id) + ' · ' + esc(q.who) + ' 问的 · 等了 ' + dur(new Date(q.answeredAt) - new Date(q.ts)) + (q.answeredVia ? ' · 在' + esc(q.answeredVia) + '里答的' : '') + (q.slice ? ' · ' + esc(q.slice) : '') + '</span></div>' +
        '<div class="q">' + esc(q.question) + '</div><div class="a">→ ' + esc(q.answer) + (q.lean && q.answer && !String(q.answer).startsWith(q.lean) ? '　<span style="color:#9a6700;font-weight:400">（跟它偏向的「' + esc(q.lean) + '」不一样）</span>' : '') + '</div></div>'
    } else {
      const g = r.g
      h += '<div class="rec gate"><div class="top"><span>' + hm(r.ts) + '</span><b>拍板</b><span>' + esc(g.slice || '') + (g.via ? ' · ' + esc(g.via) : '') + '</span></div><div class="q">' + esc(g.text) + '</div></div>'
    }
  }
  if (!shown.length) h += '<div class="none">还没有记录。</div>'
  const el = document.getElementById('mine'); el.innerHTML = h
  el.querySelectorAll('.filters button').forEach((b) => (b.onclick = () => { mineFilter = b.dataset.f; try { localStorage.setItem('chat-mine-filter', mineFilter) } catch (e) {} ; drawMine(d) }))
}

// 关卡按钮：跟切片页的按钮走同一条路（工作台的 /slice/<关卡>），按完立刻重取
async function gate(btn, kind, slice) {
  btn.disabled = true
  try {
    const r = await fetch('../../slice/' + kind + '?slice=' + encodeURIComponent(slice), { method: 'POST' })
    const t = await r.text()
    D.toast(r.ok ? slice + ' ' + btn.textContent + '：记上了' : '没记上：' + t)
    if (!r.ok) btn.disabled = false
    D.refresh()
  } catch (e) { D.toast('没记上：' + e.message); btn.disabled = false }
}

// ---------- 左侧：当前任务 ----------
let taskD = null
let foldPref = {}
try { foldPref = JSON.parse(localStorage.getItem('chat-fold') || '{}') } catch (e) {}
function saveFold() { try { localStorage.setItem('chat-fold', JSON.stringify(foldPref)) } catch (e) {} }
document.getElementById('foldall').onclick = () => {
  const anyOpen = [...document.querySelectorAll('#mem .grp')].some((g) => !g.classList.contains('folded') && g.querySelector('.sub').innerHTML)
  for (const n of D.ORDER) foldPref[n] = anyOpen
  saveFold(); drawTasks(taskD)
}
function drawTasks(d) {
  taskD = d
  const evs = D.events(d), trips = D.trips(evs), pend = D.pending(d)
  const flash = (el) => { const m = document.getElementById('m-' + el.dataset.i); const msgEl = m && (m.nextElementSibling || m); if (!msgEl) return; msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); msgEl.classList.remove('flash'); void msgEl.offsetWidth; msgEl.classList.add('flash') }
  // 看以前的某一天时，「已多久」算到那一天的最后一笔，不算到现在
  const today = d.date === new Date().toLocaleDateString('sv-SE')
  const endTs = today ? Date.now() : +new Date(evs.at(-1)?.ts ?? Date.now())
  const ago = (ts) => dur(endTs - new Date(ts))
  const card = (t) => {
    const last = t.steps.at(-1)
    return '<div class="task" style="border-left-color:' + role(t.who).color + '" data-i="' + t.start.i + '">' +
      '<div class="tw"><i></i><span>' + esc(t.text) + '</span></div>' +
      (D.planState(t) ? '<div class="pbar"><i style="width:' + Math.round(D.planState(t).at / D.planState(t).n * 100) + '%"></i></div>' : '') +
      '<div class="tn" style="margin-top:4px">' + (D.planState(t) ? '<span>第 <b>' + (D.planState(t).at || 0) + '</b> / ' + D.planState(t).n + ' 步</span>' : (t.who === '分身' ? '<span>分身只读，不报计划</span>' : '<span>没报计划</span>')) + '<span>细步 <b>' + t.steps.length + '</b> 句</span><span>已 <b>' + ago(t.start.ts) + '</b></span>' + (t.asks.length ? '<span style="color:#cf222e">发问 ' + t.asks.length + '</span>' : '') + '</div>' +
      (last ? '<div class="tl">最近一步（' + hm(last.ts) + '，' + ago(last.ts) + '前）：' + esc(String(last.text).slice(0, 80)) + (String(last.text).length > 80 ? '…' : '') + '</div>' : '<div class="tl">还没写细步</div>') + '</div>'
  }
  let h = ''
  for (const n of D.ORDER) {
    const mine = trips.filter((t) => t.who === n)
    const open = mine.filter((t) => !t.end)
    const busy = open.length > 0
    let st, below = ''
    if (n === '人') {
      st = pend.length ? '<span style="color:#cf222e">' + pend.length + ' 件等你</span>' : '在线'
      if (pend.length) below = '<div class="task wait">' + pend.map((q) => '<div class="tt">' + esc(q.who) + ' 问：' + esc(q.question) + '</div><div class="tn"><span>已等 <b>' + ago(q.ts) + '</b></span></div>').join('<div style="height:6px"></div>') + '</div>'
    } else if (n === '开发指挥') {
      const cur = evs.filter((e) => e.kind === 'set' && e.who === '开发指挥').at(-1)
      st = cur && !cur.done ? '<span style="color:#1a7f37">在做</span>' : '空闲'
      if (cur) below = cur.done ? '<div class="idle">刚做完（' + hm(cur.ts) + '）：' + esc(cur.text) + '</div>' : '<div class="task" style="border-left-color:' + role(n).color + '"><div class="tw"><i></i><span>' + esc(cur.text) + '</span></div><div class="tn" style="margin-top:4px"><span>已 <b>' + ago(cur.ts) + '</b></span></div></div>'
    } else {
      st = busy ? '<span style="color:#1a7f37">在干活' + (open.length > 1 ? ' ×' + open.length : '') + '</span>' : '空闲'
      const done = mine.filter((t) => t.end).at(-1)
      below = busy ? open.map(card).join('') : done ? '<div class="idle">上一趟 ' + hm(done.end.ts) + ' 交回（用了 ' + dur(new Date(done.end.ts) - new Date(done.start.ts)) + '）：' + esc(String(done.end.text).slice(0, 60)) + (String(done.end.text).length > 60 ? '…' : '') + '</div>' : ''
    }
    const active = busy || (n === '人' && pend.length > 0) || (n === '开发指挥' && /在做/.test(st))
    const isFolded = n in foldPref ? foldPref[n] : !active
    // 状态后面那一句：在做什么，或刚完成了什么
    let brief = ''
    if (n === '人') { const a = (d.questions || []).filter((q) => q.answeredAt).sort((p, q) => String(q.answeredAt).localeCompare(String(p.answeredAt)))[0]; brief = a ? '刚答了 ' + a.id + '：' + a.answer : '' }
    else if (n === '开发指挥') { const cur = evs.filter((e) => e.kind === 'set' && e.who === '开发指挥').at(-1); brief = cur ? (cur.done ? '刚做完：' : '') + cur.text : '' }
    else { const done = mine.filter((t) => t.end).at(-1); brief = busy ? open[0].text : done ? '刚完成：' + done.end.text : '今天还没派过活' }
    if (brief) st += '<span class="brief"> · ' + esc(brief) + '</span>'
    const cnt = n === '人' ? '' : busy ? (open[0] && D.planState(open[0]) ? '第 ' + D.planState(open[0]).at + '/' + D.planState(open[0]).n + ' 步 · ' : '') + ago(open[0] ? open[0].start.ts : Date.now()) : ''
    h += '<div class="grp' + (isFolded && below ? ' folded' : '') + '" data-n="' + esc(n) + '"><div class="mem' + (busy ? ' busy' : '') + '"><span class="chev">' + (below ? (isFolded ? '▶' : '▼') : '') + '</span>' + avatar(n) + '<div class="who2" title="' + esc(brief) + '"><div class="nm">' + esc(n === '人' ? '你' : n) + (role(n).desc ? '<span class="desc">' + esc(role(n).desc) + '</span>' : '') + '</div><div class="st">' + st + '</div></div>' + (cnt ? '<span class="cnt">' + cnt + '</span>' : '') + '</div><div class="sub">' + below + '</div></div>'
  }
  document.getElementById('mem').innerHTML = h
  document.querySelectorAll('#mem .grp > .mem').forEach((el) => (el.onclick = () => { const g = el.parentNode, n = g.dataset.n; foldPref[n] = !g.classList.contains('folded'); saveFold(); drawTasks(taskD) }))
  document.querySelectorAll('#mem .task[data-i]').forEach((el) => (el.onclick = () => flash(el)))
  const anyOpen = [...document.querySelectorAll('#mem .grp')].some((g) => !g.classList.contains('folded') && g.querySelector('.sub').innerHTML)
  document.getElementById('foldall').textContent = anyOpen ? '全部收起' : '全部展开'
}
setInterval(() => taskD && drawTasks(taskD), 5000)

// ---------- 迷你泳道 ----------
let lzoom = 60, lastD = null
try { lzoom = +(localStorage.getItem('chat-lzoom') ?? 60); if (localStorage.getItem('chat-lfold') === '1') document.getElementById('lanes').classList.add('folded') } catch (e) {}
function syncZoom() { document.querySelectorAll('#lanes .zoom button[data-z]').forEach((b) => b.classList.toggle('on', +b.dataset.z === lzoom)) }
syncZoom()
document.querySelectorAll('#lanes .zoom button[data-z]').forEach((b) => (b.onclick = () => { lzoom = +b.dataset.z; syncZoom(); try { localStorage.setItem('chat-lzoom', lzoom) } catch (e) {} ; lastD && drawLanes(lastD) }))
document.getElementById('lfold').onclick = () => {
  const el = document.getElementById('lanes'); el.classList.toggle('folded')
  document.getElementById('lfold').textContent = el.classList.contains('folded') ? '展开' : '收起'
  try { localStorage.setItem('chat-lfold', el.classList.contains('folded') ? '1' : '0') } catch (e) {}
}
if (document.getElementById('lanes').classList.contains('folded')) document.getElementById('lfold').textContent = '展开'

function drawLanes(d) {
  lastD = d
  const evs = D.events(d), trips = D.trips(evs)
  const svg = document.getElementById('lsvg')
  const W = Math.max(svg.parentNode.clientWidth - 28, 320), L = 70, R = 10, ROW = 15, TOP = 14
  const rows = ['业务分析', '模型师', '编码', '审查', '文职', '分身', '人']
  const today = d.date === new Date().toLocaleDateString('sv-SE')
  const ts = evs.map((e) => +new Date(e.ts))
  if (!ts.length) { svg.innerHTML = ''; document.getElementById('lnow').textContent = ''; return }
  const t1 = today ? Date.now() : Math.max(...ts)
  let t0 = lzoom ? t1 - lzoom * 60e3 : Math.min(...ts)
  if (t1 - t0 < 10 * 60e3) t0 = t1 - 10 * 60e3
  const x = (t) => L + ((Math.max(t0, Math.min(t1, t)) - t0) / (t1 - t0)) * (W - L - R)
  const y = (n) => TOP + rows.indexOf(n) * ROW
  const H = TOP + rows.length * ROW + 2
  const open = trips.filter((t) => !t.end)
  let out = ''
  rows.forEach((n, i) => {
    const live = open.find((t) => t.who === n)
    out += '<rect x="0" y="' + y(n) + '" width="' + W + '" height="' + ROW + '" fill="' + (i % 2 ? '#fff' : '#f6f8fa') + '"/>'
    out += (live ? '<circle cx="6" cy="' + (y(n) + 7.5) + '" r="3.5" fill="#1a7f37" class="live"/>' : '') + '<text x="14" y="' + (y(n) + 11) + '" style="font-weight:' + (live ? 700 : 400) + ';fill:' + (live ? role(n).color : '#8a8f98') + '">' + esc(n === '人' ? '你' : n) + '</text>'
  })
  const span = t1 - t0, step = [5, 10, 15, 30, 60, 120, 180].map((m) => m * 60e3).find((m) => span / m <= 8) || 360 * 60e3
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) out += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (TOP - 2) + '" y2="' + H + '" stroke="#e1e4e8"/><text x="' + (x(t) + 2) + '" y="10">' + hm(t) + '</text>'
  // 等你：发问到回答
  const answers = new Map(evs.filter((e) => e.kind === 'answer' && e.id).map((e) => [e.id, +new Date(e.ts)]))
  for (const e of evs) if (e.kind === 'ask') {
    const a = +new Date(e.ts), b = answers.get(e.id) ?? (e.q?.answeredAt ? +new Date(e.q.answeredAt) : Date.now())
    if (b < t0 || a > t1) continue
    out += '<rect x="' + x(a) + '" y="' + (y('人') + 3) + '" width="' + Math.max(3, x(b) - x(a)) + '" height="9" rx="2" fill="#cf222e"><title>' + esc('等你 ' + dur(b - a) + '：' + (e.q?.question || e.text)) + '</title></rect>'
  }
  // 一趟一趟的派工
  for (const t of trips) {
    if (!rows.includes(t.who)) continue
    const a = +new Date(t.start.ts), b = t.end ? +new Date(t.end.ts) : t1
    if (b < t0 || a > t1) continue
    out += '<g class="trip" data-i="' + t.start.i + '"><title>' + esc(hm(a) + '–' + (t.end ? hm(b) : '还在跑') + '（' + dur(b - a) + '）' + t.text) + '</title><rect' + (t.end ? '' : ' class="live"') + ' x="' + x(a) + '" y="' + (y(t.who) + 3) + '" width="' + Math.max(3, x(b) - x(a)) + '" height="9" rx="2" fill="' + role(t.who).color + '"/></g>'
  }
  if (today) out += '<line x1="' + x(t1) + '" x2="' + x(t1) + '" y1="' + (TOP - 2) + '" y2="' + H + '" stroke="#cf222e" stroke-dasharray="2 2"/>'
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.innerHTML = out
  svg.querySelectorAll('.trip').forEach((g) => (g.onclick = () => { const m = document.getElementById('m-' + g.dataset.i); if (!m) return; const msgEl = m.nextElementSibling || m; msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); msgEl.classList.remove('flash'); void msgEl.offsetWidth; msgEl.classList.add('flash') }))
  document.getElementById('lnow').textContent = open.length ? '● ' + open.map((t) => t.who + ' 已 ' + dur(Date.now() - new Date(t.start.ts))).join('　') : (D.pending(d).length ? '都停着，等你答' : '现在没人在跑')
}
setInterval(() => lastD && drawLanes(lastD), 15000)
window.addEventListener('resize', () => lastD && drawLanes(lastD))

D.boot(render)
</script>
</body>
</html>
