  <h1>关联服务方视角全图</h1>
  <p class="lede">站在 Joyful Love 这一边看：我们挂在注册服务方底下，替自我管理的老人做服务、做照护伙伴的活，开发票给注册服务方要钱。虚边的框是别人手里的东西，我们看得到、碰不到。点一段框出来看，点一样东西看它连着什么。</p>
