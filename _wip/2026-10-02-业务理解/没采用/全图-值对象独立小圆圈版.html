  const el = (tag, a, txt, parent) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; (parent || svg).appendChild(e); return e }
  const defs = el('defs', {})
  const m = el('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, null, defs)
  el('path', { d: 'M0 0 L10 5 L0 10 z', fill: css('--muted') }, null, m)
  const gBand = el('g', {}), gHull = el('g', {}), gE = el('g', {}), gN = el('g', {})
  ;[1, 2, 3].forEach((s) => {
    const ys = Object.values(N).filter((n) => n.st[0] === s).map((n) => n.y - hh(n))
    const ye = Object.values(N).filter((n) => n.st[n.st.length - 1] === s).map((n) => n.y + hh(n))
    const y0 = Math.min(...ys) - 14, y1 = Math.max(...ye) + 14
    el('rect', { x: 6, y: y0, width: W - 12, height: y1 - y0, rx: 10, fill: css('--tint'), opacity: s % 2 ? 0.55 : 0.3 }, null, gBand)
    el('text', { x: 14, y: y0 + 16, 'font-size': 12, fill: css('--muted') }, ['① 老人的注册', '② 服务提供', '③ 服务申报'][s - 1], null, gBand)
  })

  function anchor(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y
    const s = Math.min(NW / 2 / (Math.abs(dx) || 1e-9), hh(a) / (Math.abs(dy) || 1e-9))
    return [a.x + dx * s, a.y + dy * s]
  }
  const edges = E.map(([f, t, l, dash, s, v]) => {
    const a = N[f], b = N[t]
    const [x1, y1] = anchor(a, b), [x2, y2] = anchor(b, a)
    const g = el('g', {}, null, gE)
    if (v) { el('line', { x1, y1, x2, y2, stroke: css('--vo-line'), 'stroke-width': 1, opacity: 0.7, 'stroke-dasharray': '2 3' }, null, g); return { f, t, g, s: 0, v: 1 } }
    el('line', { x1, y1, x2, y2, stroke: css('--muted'), 'stroke-width': 1.3, 'marker-end': 'url(#ah)', 'stroke-dasharray': dash ? '4 4' : '' }, null, g)
    if (l) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2
      el('rect', { x: mx - l.length * 5.6 - 3, y: my - 8, width: l.length * 11.2 + 6, height: 15, rx: 3, fill: css('--paper'), opacity: 0.92 }, null, g)
      el('text', { x: mx, y: my + 4, 'font-size': 10.5, 'text-anchor': 'middle', fill: css('--muted') }, l, g)
    }
    return { f, t, g, s }
  })
  const nodes = {}
  for (const k in N) {
    const n = N[k]
    const party = n.t === 'p'
    const g = el('g', { class: 'n', transform: 'translate(' + (n.x - NW / 2) + ',' + (n.y - hh(n)) + ')' }, null, gN)
    if (n.t === 'v') {
      el('circle', { cx: NW / 2, cy: 16, r: 15, fill: css('--vo'), stroke: css('--vo-line'), 'stroke-width': 1.2 }, null, g)
      el('text', { x: NW / 2, y: 50, 'font-size': 11.5, 'text-anchor': 'middle', fill: css('--muted') }, n.l, g)
    } else if (party) {
      // 人的图标：一个人是个人，两个人是机构
      const org = ['mac', 'ao', 'dh', 'sau', 'ap', 'sup'].includes(k)
      el('rect', { width: NW, height: 72, fill: css('--paper'), opacity: 0.001 }, null, g)
      el('circle', { cx: NW / 2, cy: 24, r: 21, fill: css('--party'), stroke: css('--party-line'), 'stroke-width': 1.5 }, null, g)
      const person = (cx, cy, r) => {
        el('circle', { cx, cy: cy - r * 1.1, r: r * 0.55, fill: css('--party-line') }, null, g)
        el('path', { d: 'M' + (cx - r) + ' ' + (cy + r * 0.9) + ' a' + r + ' ' + r + ' 0 0 1 ' + (2 * r) + ' 0 z', fill: css('--party-line') }, null, g)
      }
      if (org) { person(NW / 2 - 7, 24, 6.5); person(NW / 2 + 7, 24, 6.5) } else person(NW / 2, 24, 8.5)
      el('text', { x: NW / 2, y: 62, 'font-size': 12.5, 'text-anchor': 'middle', fill: css('--ink'), 'font-weight': 500 }, n.l, g)
    } else {
      const kc = n.key ? '--key' : '--doc-line'
      el('rect', { width: NW, height: NH, rx: 6, fill: css(n.key ? '--keybg' : '--doc'), stroke: css(kc), 'stroke-width': n.key ? 2 : 1.5 }, null, g)
      el('rect', { x: 3, y: 3, width: NW - 6, height: NH - 6, rx: 4, fill: 'none', stroke: css(kc), 'stroke-width': 0.8, opacity: 0.6 }, null, g)
      el('text', { x: NW / 2, y: NH / 2 + 4.5, 'font-size': 12.5, 'text-anchor': 'middle', fill: css('--ink'), 'font-weight': 600 }, n.l, g)
      // 值对象：小标签挂在框的下沿
      if (n.vo) {
        let x = 6
        n.vo.forEach((v) => {
          const w = v.length * 10.5 + 10
          el('rect', { x, y: NH - 2, width: w, height: 15, rx: 7.5, fill: css('--vo'), stroke: css('--vo-line'), 'stroke-width': 1 }, null, g)
          el('text', { x: x + w / 2, y: NH + 9, 'font-size': 9.5, 'text-anchor': 'middle', fill: css('--ink') }, v, g)
          x += w + 4
        })
      }
    }
    g.addEventListener('click', () => {
      let h = '<b>' + n.l + '</b>　' + n.d + '　<span style="color:var(--muted);font-size:13px">出场：' + n.st.map((s) => '①②③'[s - 1]).join('') + '</span>'
      info.innerHTML = h
      info.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
    })
    nodes[k] = g
  }
  function hull(pts) {
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1])
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])
    const lo = [], up = []
    for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p) }
    for (const p of pts.reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p) }
    return lo.slice(0, -1).concat(up.slice(0, -1))
  }
  function focus(fo) {
    gHull.innerHTML = ''
    const ids = fo.ids
    const inF = (k) => !ids || ids.includes(k)
    for (const k in nodes) nodes[k].setAttribute('opacity', inF(k) ? 1 : 0.25)
    edges.forEach((e) => { const on = inF(e.f) && inF(e.t); e.g.setAttribute('opacity', e.v ? (!ids ? 0.6 : on ? 0.9 : 0.08) : !ids ? (e.s ? 1 : 0) : on ? (e.s ? 1 : 0.55) : 0.08) })
    if (ids) {
      const P = 14, pts = []
      ids.forEach((k) => { const n = N[k], h = hh(n); pts.push([n.x - NW / 2 - P, n.y - h - P], [n.x + NW / 2 + P, n.y - h - P], [n.x - NW / 2 - P, n.y + h + P], [n.x + NW / 2 + P, n.y + h + P]) })
      const h = hull(pts)
      el('path', { d: 'M' + h.map((p) => p.join(' ')).join(' L') + ' Z', fill: css('--hull'), 'fill-opacity': 0.06, stroke: css('--hull'), 'stroke-width': 2, 'stroke-dasharray': '7 5', 'stroke-linejoin': 'round' }, null, gHull)
    }
    info.innerHTML = fo.d
    document.querySelectorAll('#tabs button, #tabs2 button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.k === fo.k)))
  }
  const tabs = document.getElementById('tabs')
  const tabs2 = document.getElementById('tabs2')
  FOCI.forEach((fo) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = fo.k; b.textContent = fo.l; b.onclick = () => focus(fo); (fo.fine ? tabs2 : tabs).appendChild(b) })
  focus(FOCI[0])
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload()) } catch (e) {}
  new MutationObserver(() => location.reload()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
})()
</script>
