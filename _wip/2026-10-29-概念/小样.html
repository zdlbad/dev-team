<html lang="zh">
<head>

<title>概念 · 小样</title>
<style>

@media (prefers-color-scheme: dark){

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#24292f;color:#fff;font-size:13px}

.wrap{display:flex;min-height:calc(100vh - 36px)}
aside{width:220px;flex:none;border-right:1px solid var(--line);padding:16px 12px;background:var(--panel)}

aside li.on{background:var(--accent-bg);font-weight:600}
aside li.none{opacity:.45;cursor:default}
main{flex:1;padding:18px 28px;max-width:1180px}
header h1{font-size:22px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
header .def{font-size:15px;color:var(--ink);margin:6px 0 4px;max-width:900px}
header .exp{font-size:14px;color:var(--ink-2);margin:6px 0 10px;max-width:900px;line-height:1.7}

header .src{display:block;font-size:12px;color:var(--ink-3);margin-left:46px}
.gate{font-size:13px;color:var(--ink-3);font-weight:400}
button.act{font:inherit;font-size:12px;padding:3px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;margin-left:4px}
.badge{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;border:1px solid currentColor;line-height:18px;font-weight:400}
.badge.未定{color:var(--ink-3)}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto}
svg text{font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink);pointer-events:none}
svg text.sub{font-size:11px;fill:var(--ink-3)}
svg text.fact{font-size:11px;fill:var(--ink-2)}
svg text.lab{font-size:11.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
svg text.col{font-size:12px;fill:var(--ink-3);letter-spacing:2px}
.nd rect{stroke-width:1.2}
.nd.party rect,.nd.role rect{fill:var(--role);stroke:var(--role-line)}
.nd.paper rect,.nd.derived rect,.nd.fixed rect,.nd.data rect{fill:var(--data);stroke:var(--data-line)}
.nd.self rect{stroke-width:2.4}
.ed path.vis{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.ed path.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.nd{cursor:pointer}
.on-sel rect{filter:drop-shadow(0 0 4px var(--accent))}
.on-sel path.vis{stroke-width:3.2!important}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.legend .sw{display:inline-block;width:18px;height:12px;border:1px solid;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend .sw.round{border-radius:7px}
.detail{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:13px}
.detail h4{margin:0 0 2px;font-size:14px}.detail .w{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.detail dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:3px 8px}.detail dt{color:var(--ink-3);font-size:12px}.detail dd{margin:0}
.detail .sid{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:0 6px;border-radius:4px}
.pending{color:var(--warn);font-size:12px}
</style>
</head>

      text: '三个服务组各自底下分几类：居家支持十三个、辅助技术一个、家居改造一个。',
      source: 'eKit 行 130–133、448–468' },
    { id: '3', from: 'as', to: 't', kind: 'rel', label: '支持计划上批给老人的是这一层',
      text: '评估代表做完评估，支持计划上写的「批了的服务」就是服务类型；批的是类型不是具体的服务。',
      source: '§6.5 行 549–556', traces: ['R-048'] },
    { id: '4', from: 't', to: 'svc', kind: 'rel', label: '底下分成几项',
      text: '一个类型底下几项具体的服务，照护伙伴录服务、排预算时选的是那一层。',
      source: '§10.2 行 1814–1816' },
    { id: '5', from: 't', to: 'pt', kind: 'rel', label: '批了的挂在她身上，她的基金只能买这些',
      text: '批了的服务类型挂在老人身上，她名下所有基金都受它限制，不挂在某一笔基金上；转来没重评的是全部。',
      source: '§10.2 行 1816；§10.2.1 行 1944；裁定第四批第 2 条' },
    { id: '6', from: 't', to: 'pv', kind: 'rel', label: '服务方只能做自己注册类别里的',
      text: '服务方注册时登记了能做哪几类，清单上不在它注册类别里的类型做不了。',
      source: '§10.2 行 1818' },
    { id: '7', from: 't', to: 'agr', kind: 'rel', label: '协议上每项服务写它属于哪个组、哪个类型',
      text: '服务协议列每一项服务，要写它的名字、所属的服务组和类型、是不是第三方做。',
      source: '§7.2.1.1 行 701' },
  ],
}
const LIST = ['参与者', '照护伙伴', '服务组', '服务类型', '服务', '文件', '物品', '价目表', '谈定价', '基金', '基金账户类型', '基金账户', '服务记录', '证据', '预算', '照护记录', '付款对账单', '月结单', '共付比例', '照护计划']

// ---------- 画 ----------
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const W = 170, H = 48, SELF_W = 270, GAPY = 26, PADX = 24, PADY = 36, COLGAP = 190
let pinned = null, cur = '参与者'

function renderList() {
  document.getElementById('list').innerHTML = LIST.map((t, i) => `<li data-t="${esc(t)}" class="${t === cur ? 'on' : ''}${CARDS[t] ? '' : ' none'}"><span>${String(i + 1).padStart(2, '0')} ${esc(t)}</span><span class="badge 未定">${CARDS[t] ? '未定' : '小样没写'}</span></li>`).join('')
  document.getElementById('list').onclick = (e) => {
    const li = e.target.closest('li'); if (!li || !CARDS[li.dataset.t]) return
    cur = li.dataset.t; pinned = null; document.getElementById('detail').hidden = true
    renderList(); renderMain()
  }
}

function renderMain() {
  const d = CARDS[cur]
  document.getElementById('main').innerHTML = `<header>
      <h1>${esc(d.title)} <span class="badge 未定">未定</span><button class="act">定下</button><span class="gate">还没定下 · 业务分析 10-29 写</span></h1>
      <div class="def"><span class="k">定义</span>${esc(d.definition)}<span class="src">${esc(d.definitionSource)}</span></div>
      <div class="exp">${esc(d.explain)}</div>
    </header>
    <div style="height:12px"></div>
    <div class="diagram"><svg id="svg"></svg></div>
    <div class="legend">
      <span><span class="sw round" style="background:var(--role);border-color:var(--role-line)"></span>角色（圆角）</span>
      <span><span class="sw" style="background:var(--data);border-color:var(--data-line)"></span>数据（偏直角）</span>
    </div>`
  bindSvg()
  draw()
}

function layout(d) {
  const left = d.nodes.filter((x) => x.side === 'left'), right = d.nodes.filter((x) => x.side === 'right'), self = d.nodes.find((x) => x.kind === 'self')
  const selfH = 40 + 18 * (self.facts?.length ?? 0) + 10
  const tall = Math.max(left.length * (H + GAPY) - GAPY, right.length * (H + GAPY) - GAPY, selfH)
  const pos = {}
  const stack = (list, x) => { const h = list.length * (H + GAPY) - GAPY, y0 = PADY + (tall - h) / 2; list.forEach((n, r) => { pos[n.id] = { x, y: y0 + r * (H + GAPY), w: W, h: H } }) }
  stack(left, PADX)
  pos[self.id] = { x: PADX + W + COLGAP, y: PADY + (tall - selfH) / 2, w: SELF_W, h: selfH }
  stack(right, PADX + W + COLGAP + SELF_W + COLGAP)
  return { pos, width: PADX * 2 + W * 2 + COLGAP * 2 + SELF_W, height: PADY * 2 + tall }
}


function draw() {
  const d = CARDS[cur], { pos, width, height } = layout(d)
  let g = `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker>
</defs>`
  // 同一个来路分出几条线、或几条线汇到它身上时，终点在它身上错开，字各在各的线上
  const inTo = {}, outFrom = {}
  for (const e of d.edges) { (inTo[e.to] ??= []).push(e); (outFrom[e.from] ??= []).push(e) }
  const slot = (list, e, p) => { const i = list.indexOf(e), n = list.length; return p.y + p.h * (i + 1) / (n + 1) }
  for (const e of d.edges) {
    const a = pos[e.from], b = pos[e.to]
    const y1 = outFrom[e.from].length > 1 ? slot(outFrom[e.from], e, a) : a.y + a.h / 2
    const y2 = inTo[e.to].length > 1 ? slot(inTo[e.to], e, b) : b.y + b.h / 2
    const x1 = a.x + a.w, x2 = b.x - 2, dx = (x2 - x1) * 0.45
    const path = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`
    const t = 0.5, mt = 0.5
    const lx = mt ** 3 * x1 + 3 * mt * mt * t * (x1 + dx) + 3 * mt * t * t * (x2 - dx) + t ** 3 * x2
    const ly = mt ** 3 * y1 + 3 * mt * mt * t * y1 + 3 * mt * t * t * y2 + t ** 3 * y2
    g += `<g class="ed ${esc(e.kind)}" data-e="${esc(e.id)}"><path class="vis" d="${path}" marker-end="url(#a)"/><path class="hit" d="${path}"/>
      <text class="lab" x="${lx}" y="${ly - 5}" text-anchor="middle">${esc(e.label)}</text></g>`
  }
  for (const n of d.nodes) {
    const p = pos[n.id]
    let inner
    if (n.kind === 'self') {
      inner = `<text x="${p.x + p.w / 2}" y="${p.y + 24}" text-anchor="middle" style="font-size:15px;font-weight:600">${esc(n.title)}</text>`
        + n.facts.map((f, i) => `<text class="fact" x="${p.x + 14}" y="${p.y + 46 + i * 18}">· ${esc(f.name)}</text>`).join('')
    } else {
      inner = `<text x="${p.x + p.w / 2}" y="${p.y + (n.sub ? 20 : 29)}" text-anchor="middle">${esc(n.title)}</text>${n.sub ? `<text class="sub" x="${p.x + p.w / 2}" y="${p.y + 37}" text-anchor="middle">${esc(n.sub)}</text>` : ''}`
    }
    g += `<g class="nd ${esc(n.kind)}${n.kind === 'self' ? (n.role ? ' role' : ' data') : ''}" data-n="${esc(n.id)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${n.kind === 'party' || (n.kind === 'self' && n.role) ? 20 : 3}"/>${inner}</g>`
  }
  const svg = document.getElementById('svg')
  svg.setAttribute('width', width); svg.setAttribute('height', height); svg.innerHTML = g
}

// ---------- 解释浮在旁边 ----------
const KIND = { paper: '原料里的纸', party: '业务里的一方', self: '这样东西', derived: '它牵出的', fixed: '政府定死的清单' }
const EKIND = { rel: '关系' }
function fill(key) {
  const d = CARDS[cur], pop = document.getElementById('detail')
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : ''
  if (key.n) {
    const n = d.nodes.find((x) => x.id === key.n)
    pop.innerHTML = `<h4>${esc(n.title)}</h4><div class="w">${KIND[n.kind]}${n.sub ? ' · ' + esc(n.sub) : ''}</div><dl>${(n.facts ?? []).map((f) => row(f.name, f.text)).join('')}${row('出处', n.source)}</dl>`
  } else {
    const e = d.edges.find((x) => x.id === key.e), name = (id) => d.nodes.find((x) => x.id === id)?.title ?? id
    pop.innerHTML = `<h4>${esc(name(e.from))} → ${esc(name(e.to))}</h4><div class="w">${EKIND[e.kind]} · ${esc(e.label)}</div>
      <dl>${row('说的是', e.text)}${row('故事', e.story)}${row('出处', e.source)}${row('业务', (e.traces ?? []).join('、'))}<dt>编号</dt><dd><span class="sid">${esc(d.title)} #${esc(e.id)}</span></dd></dl>`
  }
}
function place(ev) {
  const pop = document.getElementById('detail'); pop.hidden = false
  const w = pop.offsetWidth, ht = pop.offsetHeight
  let x = ev.clientX + 16; if (x + w > innerWidth - 8) x = ev.clientX - w - 16
  pop.style.left = Math.max(8, x) + 'px'; pop.style.top = Math.max(8, Math.min(ev.clientY - 20, innerHeight - ht - 8)) + 'px'
}
const keyOf = (t) => { const n = t.closest('.nd'), e = t.closest('.ed'); return n ? { n: n.dataset.n } : e ? { e: e.dataset.e } : null }
function select(k, ev) {
  const id = JSON.stringify(k), pop = document.getElementById('detail')
  document.querySelectorAll('.on-sel').forEach((n) => n.classList.remove('on-sel'))
  if (pinned === id) { pinned = null; pop.hidden = true; return }
  pinned = id; fill(k); place(ev)
  document.querySelector(k.e ? `.ed[data-e="${k.e}"]` : `.nd[data-n="${k.n}"]`)?.classList.add('on-sel')
}
function bindSvg() {
  const svg = document.getElementById('svg'), pop = () => document.getElementById('detail')
  svg.addEventListener('mousemove', (ev) => { if (pinned) return; const k = keyOf(ev.target); if (!k) { pop().hidden = true; return } fill(k); place(ev) })
  svg.addEventListener('mouseleave', () => { if (!pinned) pop().hidden = true })
  svg.addEventListener('click', (ev) => { const k = keyOf(ev.target); if (!k) return; ev.stopPropagation(); select(k, ev) })
}
document.addEventListener('click', (ev) => {
  if (pinned && !ev.target.closest('.detail')) { pinned = null; document.getElementById('detail').hidden = true; document.querySelectorAll('.on-sel').forEach((n) => n.classList.remove('on-sel')) }
})
renderList(); renderMain()
</script>
</body>
</html>
